[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitplane-extractor"
version = "1.0.0"
description = "Bit-plane extractor and brute-forcer for image steganography"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeremy Hou" }]
keywords = ["steganography", "ctf", "forensics", "bit-plane", "lsb"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["numpy>=1.24", "pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/GoSlowPoke168/bitplane-extractor"

[project.scripts]
bitplane = "bitplane:main"

[tool.setuptools]
py-modules = ["bitplane"]
